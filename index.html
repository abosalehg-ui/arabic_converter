<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      The app is fully client-side and talks to no external host, so everything
      is locked to 'self'. Notes:
        - style-src needs 'unsafe-inline' because Vite injects <style> tags in
          dev; the production build ships a plain stylesheet.
        - worker-src covers the conversion Web Worker.
        - frame-ancestors is deliberately absent: it is ignored in a <meta> CSP
          and GitHub Pages cannot set response headers. See README.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a1553a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="عاكس النصوص العربية — أداة عصرية لعكس وتشكيل النصوص العربية"
    />
    <title>عاكس النصوص العربية</title>
    <script src="%BASE_URL%theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif">
        هذا التطبيق يحتاج إلى تفعيل JavaScript للعمل.
        <br />
        This application requires JavaScript to be enabled.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
