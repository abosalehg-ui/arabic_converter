name: CI and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit SHA rather than a moving tag: a
# compromised upstream tag would otherwise run arbitrary code in this pipeline.
# The comment records which release each SHA corresponds to.

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Audit production dependencies
        # Blocking: this covers everything that actually ships to users.
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        # Non-blocking: the ESLint 9 toolchain still pulls minimatch@3, which
        # depends on a brace-expansion version flagged by GHSA-mh99-v99m-4gvg.
        # There is no non-breaking upstream fix yet and it is build-time only.
        run: npm audit --audit-level=high || true

      - run: npm run lint
      - run: npm run check:contrast
      - run: npm test
      - run: npm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
